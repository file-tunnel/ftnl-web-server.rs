[identity]
service = "ftnl-web-server"
type_name = "RuntimeEnv"

[help]
url = "https://github.com/flags-2-env/flags-2-env"
columns = ["options", "env", "type", "default", "description"]

[parse]
allow_unknown = false

[env]
ignore = ["FTNL_NATS_URL", "FTNL_READONLY_DATABASE_URL"]

[flags.help]
env = "CLI_HELP_REQUESTED"
long = "help"
short = "h"
type = "boolean"
default = false
help = "Print command-line help."

[flags.version]
env = "CLI_VERSION_REQUESTED"
long = "version"
short = "V"
type = "boolean"
default = false
help = "Print the package version."

[flags.web-bind]
env = "FTNL_WEB_BIND"
long = "web-bind"
type = "string"
default = "127.0.0.1:3000"
help = "Anonymous portal listener socket address."

[flags.api-origin]
env = "FTNL_API_ORIGIN"
long = "api-origin"
type = "string"
default = "http://127.0.0.1:8080"
help = "Credential-free browser API origin."

[flags.shared-auth-base-url]
env = "SHARED_AUTH_BASE_URL"
long = "shared-auth-base-url"
type = "string"
help = "Credential-free Shared Auth base URL for the control binary."

[flags.shared-auth-issuer]
env = "SHARED_AUTH_ISSUER"
long = "shared-auth-issuer"
type = "string"
help = "Expected Shared Auth token issuer for the control binary."

[flags.shared-auth-audience]
env = "SHARED_AUTH_AUDIENCE"
long = "shared-auth-audience"
type = "string"
help = "Expected Shared Auth token audience for the control binary."

[flags.shared-auth-jwks-url]
env = "SHARED_AUTH_JWKS_URL"
long = "shared-auth-jwks-url"
type = "string"
help = "Optional credential-free Shared Auth JWKS URL."

[flags.control-mode]
env = "FTNL_CONTROL_MODE"
long = "control-mode"
type = "string"
default = "http"
help = "Control backend: direct_read, http, tcp, or nats."

[flags.api-base-url]
env = "FTNL_API_BASE_URL"
long = "api-base-url"
type = "string"
help = "Credential-free control HTTP backend base URL."

[flags.api-tcp-addr]
env = "FTNL_API_TCP_ADDR"
long = "api-tcp-addr"
type = "string"
help = "Control TCP backend socket address."

[flags.trusted-mesh-tcp]
env = "FTNL_TRUSTED_MESH_TCP"
long = "trusted-mesh-tcp"
type = "boolean"
default = false
help = "Allow reviewed trusted-mesh control TCP outside loopback."

[flags.nats-read-subject]
env = "FTNL_NATS_READ_SUBJECT"
long = "nats-read-subject"
type = "string"
default = "ftnl.tunnel.read.v1"
help = "Core NATS read subject."

[flags.control-bind]
env = "FTNL_CONTROL_BIND"
long = "control-bind"
type = "string"
default = "127.0.0.1:3100"
help = "Account control listener socket address."

[flags.rust-log]
env = "RUST_LOG"
long = "rust-log"
type = "string"
help = "Tracing filter for the selected binary."
