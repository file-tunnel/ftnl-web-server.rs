[package]
name = "ftnl-web-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Privacy-preserving mobile upload portal for File Tunnel"
repository = "https://github.com/file-tunnel/ftnl-web-server.rs"

[dependencies]
async-nats = "0.46"
async-trait = "0.1"
axum = "0.8"
ftnl-interfaces = { git = "https://github.com/file-tunnel/ftnl-interfaces.git", rev = "ba3f5d9f95a2ceee5fcf1516d7108e065813967a" }
futures-util = "0.3"
maud = { version = "0.27", features = ["axum"] }
next-loggers = { package = "oresoftware-next-loggers", git = "https://github.com/ores-otel/ores.otel.log.git", rev = "64a4ee0ed839a8de7e9ba2588899a24e25b05a65" }
ores-lib-core = { git = "https://github.com/ores-otel/ores-lib-core.git", rev = "0a8d1eaad5df2cc2c0b676432313f4ac047f5191" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sea-orm = { version = "1.1", default-features = false, features = ["runtime-tokio-rustls", "sqlx-postgres"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared-auth-lib = { git = "https://github.com/shared-auth/shared-auth-lib.git", rev = "4972cfd4eee43ddd9130b9c846caff1c5da7ae95" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
tower-http = { version = "0.7", features = ["request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
proptest = "1"
tower = { version = "0.5", features = ["util"] }
