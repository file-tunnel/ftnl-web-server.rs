[package]
org = "file-tunnel"
name = "ftnl-web-server-rs"
version = "0.1.0"
description = "File Tunnel upload portal and account control web server"
license = "MIT"
keywords = ["web", "rust", "file-transfer", "json-schema", "opentelemetry"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/file-tunnel/ftnl-web-server.rs"

# The portal consumes generated/shared schema artifacts through the Zed package
# graph. It does not link the SQL/ORM engine into the request-serving binary.
[dependencies]
"file-tunnel/ftnl-interfaces" = "^0.1.0"
"file-tunnel/ftnl-lib-core" = "^0.1.0"
"shared-auth/shared-auth-lib" = "^0.1.0"
"ores-otel/ores-lib-core" = "^0.1.0"
"oresoftware/next-loggers" = "^0.1.0"

[build]
command = "cargo build --release --locked"
outputs = ["target/release/ftnl-web-server", "target/release/ftnl-control-web"]

[install]
adapter = "none"
dir = ".vendor/.zed"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "test -x \"$ZED_PKG_TEST_TARGET/target/release/ftnl-web-server\" && test -x \"$ZED_PKG_TEST_TARGET/target/release/ftnl-control-web\""
exclude = [".env", ".env.*", "env/dec/**", ".direnv/**", ".cache/**", "target/**", "**/*.log", ".DS_Store"]

[targets.rust]
dir = "."
adapter = "rust"

[scripts]
test = "nix develop --command agent-check"
